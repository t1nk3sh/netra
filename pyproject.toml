[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netra"
version = "0.1.0"
description = "NETra - ML-Based Detection of Cyber Threats in Unidirectional IP Traffic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "xgboost",
    "joblib",
    "pydantic",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "pyyaml",
    "scapy"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
